<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인벤토리 / 창고 UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --slot: #1b2f49;
    --slot-border: #4a6d92;
    --text-main: #242a31;
    --text-sub: #4c545d;
    --cyan: #cdd5de;
    --cyan-bright: #ffffff;
    --cyan-rgb: 205, 213, 222;
    --hairline: rgba(40, 46, 54, 0.14);
    --glow: 0.72;
    --blur: 6px;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #060c14; overflow: hidden; }
  body { font-family: 'IBM Plex Sans KR', sans-serif; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #060c14; }
  #canvas { width: 1920px; height: 1080px; transform-origin: center center; }
  #root { width: 100%; height: 100%; }

  .app-root {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    color: var(--text-main);
    background: radial-gradient(1200px 820px at 50% 28%, #122339 0%, #0c1a2c 66%, #091221 100%);
  }
  /* chroma: milky monochrome chrome. */
  .chroma-calm { --chrome: rgba(255, 255, 255, 0.45); --chrome-strong: rgba(255, 255, 255, 0.6);
    --cat-on-bg: rgba(40, 46, 54, 0.82); --cat-on-bd: rgba(40, 46, 54, 0.9); --cat-on-fg: #ffffff; }
  .chroma-lit { --chrome: rgba(255, 255, 255, 0.5); --chrome-strong: rgba(255, 255, 255, 0.66);
    --cat-on-bg: rgba(40, 46, 54, 0.82); --cat-on-bd: rgba(40, 46, 54, 0.9); --cat-on-fg: #ffffff; }

  /* blurred game-world backdrop behind the frosted panel */
  .world-bg { position: absolute; inset: -60px; z-index: 0; pointer-events: none;
    filter: blur(2px) saturate(1.12); }
  .world-bg[data-scene="off"] { display: none; }
  .world-bg[data-scene="game"] {
    background-image: url("scene-game.png");
    background-size: cover; background-position: center; background-repeat: no-repeat; }
  .world-bg[data-scene="game"]::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(rgba(11, 24, 40, 0.28), rgba(9, 19, 33, 0.4)); }
  .world-bg[data-scene="canyon"] { background:
    radial-gradient(58% 40% at 22% 13%, rgba(156, 204, 228, 0.5), transparent 70%),
    radial-gradient(50% 34% at 80% 9%, rgba(196, 218, 184, 0.4), transparent 70%),
    radial-gradient(82% 56% at 33% 116%, rgba(54, 142, 96, 0.62), transparent 60%),
    radial-gradient(70% 50% at 86% 108%, rgba(104, 156, 74, 0.5), transparent 55%),
    radial-gradient(42% 60% at 60% 58%, rgba(72, 134, 152, 0.28), transparent 72%),
    linear-gradient(180deg, #1d3c56 0%, #245343 50%, #2d5b3b 100%); }
  .world-bg[data-scene="snow"] { background:
    radial-gradient(70% 46% at 30% 12%, rgba(206, 228, 246, 0.6), transparent 70%),
    radial-gradient(60% 40% at 78% 16%, rgba(170, 200, 226, 0.45), transparent 70%),
    radial-gradient(82% 56% at 50% 116%, rgba(150, 186, 216, 0.56), transparent 60%),
    linear-gradient(180deg, #2b4a68 0%, #375b7c 55%, #4b7090 100%); }
  .world-bg[data-scene="night"] { background:
    radial-gradient(60% 46% at 25% 18%, rgba(70, 140, 200, 0.42), transparent 70%),
    radial-gradient(50% 40% at 82% 74%, rgba(95, 196, 255, 0.32), transparent 66%),
    radial-gradient(82% 60% at 50% 120%, rgba(22, 64, 96, 0.6), transparent 55%),
    linear-gradient(180deg, #0f2438 0%, #132c42 55%, #0d1e30 100%); }
  .world-bg::after { content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(72deg, transparent 42%, rgba(255, 250, 230, 0.06) 50%, transparent 58%),
      radial-gradient(3px 90px at 33% 22%, rgba(255, 245, 210, 0.16), transparent),
      radial-gradient(3px 72px at 68% 30%, rgba(255, 245, 210, 0.1), transparent); }

  /* ambient game-screen backdrop */
  .ambiance { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(var(--cyan-rgb), 0.10), transparent 60%),
      radial-gradient(760px 620px at 10% 112%, rgba(70, 130, 210, 0.10), transparent 60%),
      radial-gradient(720px 600px at 92% 102%, rgba(var(--cyan-rgb), 0.06), transparent 60%);
  }
  .ambiance::after { content: ''; position: absolute; inset: 0; opacity: 0.32;
    background-image:
      linear-gradient(rgba(var(--cyan-rgb), 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--cyan-rgb), 0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
  }

  /* top segmented switcher */
  .topbar { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); z-index: 20; }
  .brand { position: absolute; top: 34px; left: 44px; z-index: 20; display: flex; align-items: center; gap: 10px; color: #4a525c; }
  .brand-t { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: 0.16em; color: #2a2f37; }
  .brand-k { color: #6b7785; }

  /* floating blur control (always visible) */
  .blur-ctl { position: absolute; top: 30px; right: 60px; z-index: 25; display: flex; align-items: center; gap: 11px;
    padding: 9px 15px; border-radius: 10px; background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
  .bc-label { font-size: 13px; color: #4a525c; font-family: var(--mono); white-space: nowrap; letter-spacing: 0.02em; }
  .bc-label b { color: #2a2f37; font-weight: 700; }
  .bc-range { width: 130px; height: 4px; accent-color: #586472; cursor: pointer; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 11px;
    background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.6); }
  .seg-btn { font: inherit; font-size: 14px; color: #4a525c; padding: 9px 18px; border-radius: 7px;
    background: transparent; border: none; cursor: pointer; display: flex; align-items: center; gap: 9px; letter-spacing: 0.02em; transition: 0.15s; white-space: nowrap; }
  .seg-btn:hover { color: #20262d; }
  .seg-btn.on { color: #ffffff; background: #2a2f37; font-weight: 600; }
  kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: rgba(40, 46, 54, 0.1); color: #4a525c; border: 1px solid rgba(40, 46, 54, 0.2); }
  .seg-btn.on kbd { background: rgba(255, 255, 255, 0.2); color: #ffffff; border-color: rgba(255, 255, 255, 0.25); }

  /* stage */
  .stage-wrap { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
  .fade-root { position: relative; }
  .layout-single { position: relative; }
  .layout-dual { position: relative; display: flex; align-items: stretch; }
  .dual-divider { width: 1px; margin: 0 32px; align-self: stretch;
    background: linear-gradient(180deg, transparent, rgba(var(--cyan-rgb), 0.4), transparent); }

  /* merged 창고+가방 — single wide frame */
  .merged { position: relative; padding: 18px 22px; border-radius: 16px;
    border: 1px solid var(--chrome-strong);
    background: linear-gradient(160deg, rgba(240, 242, 245, 0.44), rgba(228, 231, 236, 0.52));
    backdrop-filter: blur(var(--blur)) saturate(1.05); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.05);
    box-shadow: 0 26px 66px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .merged-head { display: flex; align-items: flex-end; position: relative;
    padding: 13px 18px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(232, 235, 239, 0.66), rgba(220, 224, 230, 0.6));
    backdrop-filter: blur(22px) saturate(1.02); -webkit-backdrop-filter: blur(22px) saturate(1.02);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6); }
  .mhcol { flex: 0 0 auto; }
  .mhcol-wh { width: var(--wh-w); }
  .mhcol-bag { width: var(--bag-w); padding-right: 46px; }
  .merged-body { display: flex; margin-top: 14px; }
  .merged-foot { display: flex; align-items: center; margin-top: 14px;
    padding: 13px 18px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(232, 235, 239, 0.66), rgba(220, 224, 230, 0.6));
    backdrop-filter: blur(22px) saturate(1.02); -webkit-backdrop-filter: blur(22px) saturate(1.02);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6); }
  .mfcol { display: flex; align-items: center; gap: 8px; }
  .mfcol-wh { width: var(--wh-w); }
  .mfcol-bag { width: var(--bag-w); }
  /* body columns carry distinct tones: 창고 darker, 가방 brighter */
  .mcol { position: relative; }
  .mcol > * { position: relative; z-index: 1; }
  .mcol::before { content: ''; position: absolute; inset: -10px -12px -12px; border-radius: 12px; z-index: 0; }
  .mcol-warehouse::before { background: linear-gradient(160deg, rgba(20, 26, 34, 0.08), rgba(20, 26, 34, 0.04)); }
  .mcol-bag::before { background: linear-gradient(160deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08)); }
  /* one continuous vertical seam through head / body / foot (same x) */
  .vsep { flex: 0 0 1px; width: 1px; margin: 0 27px; align-self: stretch;
    background: linear-gradient(180deg, transparent, rgba(40, 46, 54, 0.28) 18%, rgba(40, 46, 54, 0.28) 82%, transparent); }
  .vsep-head, .vsep-foot { background: rgba(40, 46, 54, 0.12); }
  .close-x2 { position: absolute; top: -4px; right: -6px; width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.4); color: #4a525c;
    border: 1px solid rgba(255, 255, 255, 0.55); cursor: pointer; transition: 0.14s; z-index: 12; }
  .close-x2:hover { color: #20262d; border-color: rgba(70, 78, 90, 0.5); background: rgba(255, 255, 255, 0.6); }
  .merged .mcol .cat-row { margin-top: 0; }

  .close-x { position: absolute; top: -46px; right: 0; width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.4); color: #4a525c;
    border: 1px solid rgba(255, 255, 255, 0.55); cursor: pointer; backdrop-filter: blur(6px); transition: 0.14s; z-index: 12; }
  .close-x:hover { color: #20262d; border-color: rgba(70, 78, 90, 0.5); background: rgba(255, 255, 255, 0.6); }

  /* panel = ONE light frosted surface, blurred uniformly. (blur split handled in engine code.) */
  /* panel = thin DARK base layer behind everything; light bands sit on top (base peeks as a thin rim + footer) */
  .panel { position: relative; padding: 3px; border-radius: 14px; overflow: hidden;
    border: none;
    background: rgba(26, 31, 38, 0.3);
    backdrop-filter: blur(var(--blur)) saturate(0.5); -webkit-backdrop-filter: blur(var(--blur)) saturate(0.5);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.5); }
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.5); }
  .br { display: none; }

  /* header band — light, sits on the dark base */
  .p-head { display: flex; align-items: center; gap: 12px;
    padding: 9px 14px 8px 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)), rgba(214, 219, 224, 0.6);
    border-bottom: 1px solid rgba(20, 24, 30, 0.5); }
  .title-ico { position: relative; width: 36px; height: 40px; flex-shrink: 0; display: grid; place-items: center;
    background: transparent; color: var(--text-main); }
  .head-x { position: relative; width: 50px; height: 44px; display: grid; place-items: center; flex-shrink: 0;
    background: transparent; border: none; color: var(--text-main); cursor: pointer; transition: 0.16s; }
  .head-x:hover { color: #0c1016; }
  .merged-head .p-head { padding: 0; background: none; border: none; }
  .p-body { position: relative; padding: 0 22px 0; background: rgba(206, 211, 217, 0.5);
    backdrop-filter: blur(var(--blur)) saturate(0.5); -webkit-backdrop-filter: blur(var(--blur)) saturate(0.5); }
  .cap-row { display: flex; align-items: center; padding: 18px 2px 19px; }
  .p-body .cat-row { margin-top: 0; }
  .p-title { font-size: 27px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-main);
    white-space: nowrap; flex: 1; text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5); }
  .cap { display: flex; flex-direction: row; align-items: baseline; gap: 12px; }
  .cap-label { font-size: 22px; color: var(--text-sub); font-weight: 600; white-space: nowrap; }
  .cap-num { font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; color: var(--text-sub); }
  .cap-cap { color: var(--text-sub); font-weight: 600; font-size: 24px; }

  /* category row (icon-only) */
  .cat-row { display: flex; gap: 8px; margin-top: 0; }
  .cat-btn { flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 11px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.28); border: 1px solid rgba(255, 255, 255, 0.4);
    color: #4a525c; cursor: pointer; font: inherit; transition: 0.14s; }
  .cat-btn:hover { color: #20262d; background: rgba(255, 255, 255, 0.5); border-color: rgba(255, 255, 255, 0.7); }
  .cat-btn.on { color: var(--cat-on-fg); background: var(--cat-on-bg); border-color: var(--cat-on-bd);
    box-shadow: inset 0 0 0 1px var(--cat-on-bg); }

  .p-divider { height: 0; margin: 13px 0; background: none; }

  /* grid + slots */
  .grid-scroll { max-height: 432px; overflow-y: auto; overflow-x: hidden; padding: 4px 0; scrollbar-gutter: stable both-edges; }
  .grid-scroll::-webkit-scrollbar { width: 7px; }
  .grid-scroll::-webkit-scrollbar-track { background: rgba(40, 46, 54, 0.08); border-radius: 4px; }
  .grid-scroll::-webkit-scrollbar-thumb { background: rgba(40, 46, 54, 0.28); border-radius: 4px; }
  .grid-scroll::-webkit-scrollbar-thumb:hover { background: rgba(40, 46, 54, 0.45); }
  .grid { display: grid; gap: 14px; grid-auto-rows: 96px; justify-content: center; }
  .merged .mcol .cat-row, .merged .mcol .p-divider { margin-top: 0; }
  .merged .mcol .cat-row { padding: 0 8px; }

  /* slots = darker translucent cells sitting on the light frosted panel. thin light hairline border. */
  /* slots = light-black fill with a STRONG dark border (like endfield) */
  .slot { width: 96px; height: 96px; position: relative; border-radius: 2px; border: 2px solid rgba(10, 12, 16, 0.55);
    background: rgba(26, 30, 36, 0.30);
    display: grid; place-items: center; cursor: pointer; color: #e6ebf1; overflow: hidden;
    transition: box-shadow 0.13s ease, border-color 0.13s ease, background 0.13s ease; }
  .slot.empty { border-color: rgba(10, 12, 16, 0.42); cursor: default;
    background: rgba(20, 24, 30, 0.2); }
  .slot-icon { position: relative; z-index: 2; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5)); }
  .slot.sel .slot-icon { filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.45)); }
  .slot-qty, .new-dot, .gb-underline { z-index: 3; }

  .slot:not(.empty):hover { border-color: rgba(255, 255, 255, 0.5); background: rgba(26, 30, 36, 0.4); }
  .slot[data-glow="soft"].sel { border-color: #ffffff; background: rgba(26, 30, 36, 0.45); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
  .slot[data-glow="ring"]:not(.empty):hover { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.6); }
  .slot[data-glow="ring"].sel { border-color: #ffffff; box-shadow: inset 0 0 0 2px #ffffff; }
  .slot[data-glow="edge"]:not(.empty):hover { border-color: rgba(255, 255, 255, 0.6); box-shadow: inset 0 -3px 0 -1px rgba(255, 255, 255, 0.6); }
  .slot[data-glow="edge"].sel { border-color: #ffffff; box-shadow: inset 0 -3px 0 -1px #ffffff; }

  .slot-qty { position: absolute; top: 6px; right: 6px; font-family: var(--mono); font-size: 14px; font-weight: 700;
    line-height: 1; color: #ffffff; background: rgba(8, 10, 14, 0.62); padding: 3px 6px; border-radius: 4px; letter-spacing: 0.02em; }
  .new-dot { position: absolute; top: 7px; left: 7px; width: 9px; height: 9px; border-radius: 50%;
    background: #ff5a3c; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85), 0 0 6px rgba(255, 90, 60, 0.6); }

  /* grade bars */
  .gb-aurora { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; pointer-events: none; z-index: 1; }
  .gb-underline { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; z-index: 2; }
  .gb-corner { position: absolute; bottom: 3px; width: 10px; height: 10px; border: 1.5px solid; }
  .gb-bl { left: 3px; border-top: none; border-right: none; border-radius: 0 0 0 3px; }
  .gb-br { right: 3px; border-top: none; border-left: none; border-radius: 0 0 3px 0; }
  .gb-full { position: absolute; inset: 0; border-radius: 8px; pointer-events: none; }

  /* tooltip */
  .tooltip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    padding: 10px 14px; border-radius: 9px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
    background: rgba(5, 10, 18, 0.97); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--cyan); border-left: 3px solid var(--cyan);
    white-space: nowrap; z-index: 60; pointer-events: none;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 18px rgba(var(--cyan-rgb), 0.25); }
  .tt-name { font-size: 17px; font-weight: 700; color: #ffffff; letter-spacing: 0.01em; }
  .tt-grade { font-size: 13px; font-weight: 600; font-family: var(--mono); }

  /* footer — NO own bg: the dark base layer shows through here */
  .bottom-bar { display: flex; align-items: center; gap: 8px;
    margin-top: 6px; padding: 15px 22px;
    background: transparent; }
  .bb-spacer { flex: 1; }
  .sort-wrap, .sort-btn, .icon-btn, .act-btn { flex-shrink: 0; }
  .act-btn, .sort-btn, .act-label, .sort-item, .cat-label { white-space: nowrap; }
  .sort-wrap { position: relative; display: flex; gap: 6px; }
  .sort-btn { display: flex; align-items: center; gap: 9px; padding: 11px 16px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.5); color: var(--text-main);
    cursor: pointer; font: inherit; font-size: 16px; min-width: 124px; justify-content: space-between; transition: 0.13s; }
  .sort-btn:hover { border-color: rgba(40, 46, 54, 0.3); background: rgba(255, 255, 255, 0.55); }
  .icon-btn { position: relative; width: 46px; height: 46px; border-radius: 8px; background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.5); color: var(--text-sub); cursor: pointer; display: grid; place-items: center; transition: 0.13s; }
  .icon-btn:hover { color: var(--text-main); border-color: rgba(40, 46, 54, 0.3); background: rgba(255, 255, 255, 0.55); }
  .dir-mark { position: absolute; bottom: 2px; right: 5px; font-size: 9px; font-family: var(--mono); color: #c4ccd6; }
  .sort-scrim { position: fixed; inset: 0; z-index: 40; }
  .sort-menu { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 41; padding: 5px; min-width: 124px;
    background: rgba(22, 26, 31, 0.98); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px; box-shadow: 0 -10px 26px rgba(0, 0, 0, 0.5); }
  .sort-item { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 5px;
    background: transparent; border: none; color: #b8c0ca; cursor: pointer; font: inherit; font-size: 14px; }
  .sort-item:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
  .sort-item.on { color: #ffffff; font-weight: 600; }

  .act-btn { display: flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.5); color: var(--text-main);
    cursor: pointer; font: inherit; font-size: 16px; transition: 0.13s; }
  .act-btn:hover { color: #181c20; border-color: rgba(40, 46, 54, 0.3); background: rgba(255, 255, 255, 0.6); }
  .act-btn.danger:hover { color: #c0392b; border-color: rgba(192, 57, 43, 0.5); background: rgba(192, 57, 43, 0.1); }
  .act-btn.primary { color: #ffffff; background: rgba(52, 58, 66, 0.92); border-color: rgba(52, 58, 66, 0.92); font-weight: 600; }
  .act-btn.primary:hover { background: rgba(66, 72, 81, 0.95); border-color: rgba(66, 72, 81, 0.95); color: #ffffff; }

  /* toast */
  .toast { position: absolute; bottom: 40px; left: 50%; transform: translate(-50%, 12px); z-index: 50;
    padding: 11px 20px; border-radius: 9px; background: rgba(12, 22, 36, 0.92); backdrop-filter: blur(8px);
    border: 1px solid rgba(var(--cyan-rgb), 0.3); border-left: 3px solid var(--cyan); color: var(--text-main);
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* opening fade-in */
  @keyframes panelIn { from { opacity: 0; transform: scale(0.984) translateY(8px); } to { opacity: 1; transform: none; } }
