<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIMEKOV — 화살표 → 게이지 교체</title>
  <style>
    :root {
      --src-w: 1678;
      --src-h: 937;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #1f2024;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .stage {
      position: relative;
      width: min(96vw, 1500px);
      aspect-ratio: var(--src-w) / var(--src-h);
      box-shadow: 0 8px 36px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      background: #2a2c30;
    }
    .stage > img.bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
      user-select: none; -webkit-user-drag: none;
    }

    /* ───── Gauge — sits where »» used to be ─────
       Arrow was at x=1115..1190, y=425..470.
       Place gauge in same band. */
    .gauge {
      position: absolute;
      left: calc(1115 / var(--src-w) * 100%);
      top:  calc(425  / var(--src-h) * 100%);
      width:  calc(70  / var(--src-w) * 100%);
      height: calc(48  / var(--src-h) * 100%);
      pointer-events: none;
    }
    .gauge svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }
    .gauge .track {
      stroke: rgba(180, 215, 235, 0.55);
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(0, 0, 0, 0.45);
    }
    .gauge .fill {
      fill: url(#gaugeFill);
      filter: drop-shadow(0 0 6px rgba(255, 196, 90, 0.65));
      clip-path: inset(0 var(--clip-right, 100%) 0 0);
    }

    /* (PROCESSING label removed) */

    /* BEFORE/AFTER toggle */
    .toggle-row {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px;
      background: rgba(0,0,0,0.55);
      padding: 6px 8px; border-radius: 999px;
      backdrop-filter: blur(8px);
    }
    .toggle-row button {
      appearance: none;
      background: transparent; color: #ddd;
      border: 1px solid rgba(255,255,255,0.18); padding: 6px 14px;
      border-radius: 999px; cursor: pointer;
      font-family: inherit; font-size: 12px;
      letter-spacing: 0.06em;
    }
    .toggle-row button.active {
      background: rgba(255, 196, 90, 0.18);
      border-color: rgba(255, 196, 90, 0.6);
      color: #ffd99b;
    }
  </style>
</head>
<body>

<div class="stage" id="stage">
  <img class="bg" id="bg" src="assets/timekov-arrow-removed.png" alt="" />

  <div class="gauge">
    <svg viewBox="0 0 70 48" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gaugeFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#ffb24a" />
          <stop offset="55%" stop-color="#ffd178" />
          <stop offset="100%" stop-color="#ffe7a8" />
        </linearGradient>
      </defs>
      <!-- shorter body (35) + same head (33) -->
      <path class="track" d="
        M 3 18
        L 35 18
        L 35 6
        L 66 24
        L 35 42
        L 35 30
        L 3 30 Z" />
      <path class="fill" d="
        M 3 18
        L 35 18
        L 35 6
        L 66 24
        L 35 42
        L 35 30
        L 3 30 Z" />
    </svg>
  </div>

  <div class="toggle-row">
    <button id="btnBefore">BEFORE</button>
    <button id="btnAfter" class="active">AFTER</button>
  </div>
</div>

<script>
  const fillEl = document.querySelector('.gauge .fill');
  const DUR = 3500;
  let start = performance.now();
  function tick(now) {
    const t = ((now - start) % DUR) / DUR;
    fillEl.style.setProperty('--clip-right', `${(1 - t) * 100}%`);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const bg = document.getElementById('bg');
  const a = document.getElementById('btnAfter');
  const b = document.getElementById('btnBefore');
  const overlays = document.querySelectorAll('.gauge');
  function show(mode) {
    if (mode === 'before') {
      bg.src = 'assets/timekov-ui.png';
      overlays.forEach(el => el.style.display = 'none');
      b.classList.add('active'); a.classList.remove('active');
    } else {
      bg.src = 'assets/timekov-arrow-removed.png';
      overlays.forEach(el => el.style.display = '');
      a.classList.add('active'); b.classList.remove('active');
    }
  }
  a.addEventListener('click', () => show('after'));
  b.addEventListener('click', () => show('before'));
</script>

</body>
</html>
