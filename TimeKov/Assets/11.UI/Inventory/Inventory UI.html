<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인벤토리 / 창고 UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --slot: #1b2f49;
    --slot-border: #4a6d92;
    --text-main: #f1f7fd;
    --text-sub: #b9cadb;
    --cyan: #5fc4ff;
    --cyan-bright: #aee3ff;
    --cyan-rgb: 95, 196, 255;
    --glow: 0.72;
    --blur: 6px;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #060c14; overflow: hidden; }
  body { font-family: 'IBM Plex Sans KR', sans-serif; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #060c14; }
  #canvas { width: 1920px; height: 1080px; transform-origin: center center; }
  #root { width: 100%; height: 100%; }

  .app-root {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    color: var(--text-main);
    background: radial-gradient(1200px 820px at 50% 28%, #122339 0%, #0c1a2c 66%, #091221 100%);
  }
  /* chroma: how much cyan the UI chrome carries. 절제 = mostly neutral blue-grey. */
  .chroma-calm { --chrome: rgba(150, 178, 205, 0.26); --chrome-strong: rgba(170, 196, 222, 0.42);
    --cat-on-bg: rgba(196, 216, 238, 0.15); --cat-on-bd: rgba(186, 210, 234, 0.5); --cat-on-fg: var(--text-main); }
  .chroma-lit { --chrome: rgba(var(--cyan-rgb), 0.3); --chrome-strong: rgba(var(--cyan-rgb), 0.42);
    --cat-on-bg: rgba(var(--cyan-rgb), 0.18); --cat-on-bd: var(--cyan); --cat-on-fg: var(--cyan-bright); }

  /* blurred game-world backdrop behind the frosted panel */
  .world-bg { position: absolute; inset: -60px; z-index: 0; pointer-events: none;
    filter: blur(2px) saturate(1.12); }
  .world-bg[data-scene="off"] { display: none; }
  .world-bg[data-scene="game"] {
    background-image: url("scene-game.png");
    background-size: cover; background-position: center; background-repeat: no-repeat; }
  .world-bg[data-scene="game"]::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(rgba(11, 24, 40, 0.28), rgba(9, 19, 33, 0.4)); }
  .world-bg[data-scene="canyon"] { background:
    radial-gradient(58% 40% at 22% 13%, rgba(156, 204, 228, 0.5), transparent 70%),
    radial-gradient(50% 34% at 80% 9%, rgba(196, 218, 184, 0.4), transparent 70%),
    radial-gradient(82% 56% at 33% 116%, rgba(54, 142, 96, 0.62), transparent 60%),
    radial-gradient(70% 50% at 86% 108%, rgba(104, 156, 74, 0.5), transparent 55%),
    radial-gradient(42% 60% at 60% 58%, rgba(72, 134, 152, 0.28), transparent 72%),
    linear-gradient(180deg, #1d3c56 0%, #245343 50%, #2d5b3b 100%); }
  .world-bg[data-scene="snow"] { background:
    radial-gradient(70% 46% at 30% 12%, rgba(206, 228, 246, 0.6), transparent 70%),
    radial-gradient(60% 40% at 78% 16%, rgba(170, 200, 226, 0.45), transparent 70%),
    radial-gradient(82% 56% at 50% 116%, rgba(150, 186, 216, 0.56), transparent 60%),
    linear-gradient(180deg, #2b4a68 0%, #375b7c 55%, #4b7090 100%); }
  .world-bg[data-scene="night"] { background:
    radial-gradient(60% 46% at 25% 18%, rgba(70, 140, 200, 0.42), transparent 70%),
    radial-gradient(50% 40% at 82% 74%, rgba(95, 196, 255, 0.32), transparent 66%),
    radial-gradient(82% 60% at 50% 120%, rgba(22, 64, 96, 0.6), transparent 55%),
    linear-gradient(180deg, #0f2438 0%, #132c42 55%, #0d1e30 100%); }
  .world-bg::after { content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(72deg, transparent 42%, rgba(255, 250, 230, 0.06) 50%, transparent 58%),
      radial-gradient(3px 90px at 33% 22%, rgba(255, 245, 210, 0.16), transparent),
      radial-gradient(3px 72px at 68% 30%, rgba(255, 245, 210, 0.1), transparent); }

  /* ambient game-screen backdrop */
  .ambiance { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(var(--cyan-rgb), 0.10), transparent 60%),
      radial-gradient(760px 620px at 10% 112%, rgba(70, 130, 210, 0.10), transparent 60%),
      radial-gradient(720px 600px at 92% 102%, rgba(var(--cyan-rgb), 0.06), transparent 60%);
  }
  .ambiance::after { content: ''; position: absolute; inset: 0; opacity: 0.32;
    background-image:
      linear-gradient(rgba(var(--cyan-rgb), 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--cyan-rgb), 0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
  }

  /* top segmented switcher */
  .topbar { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); z-index: 20; }
  .brand { position: absolute; top: 34px; left: 44px; z-index: 20; display: flex; align-items: center; gap: 10px; color: var(--cyan); }
  .brand-t { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: 0.16em; color: var(--text-main); }
  .brand-k { color: var(--cyan); }

  /* floating blur control (always visible) */
  .blur-ctl { position: absolute; top: 30px; right: 60px; z-index: 25; display: flex; align-items: center; gap: 11px;
    padding: 9px 15px; border-radius: 10px; background: rgba(9, 17, 29, 0.82);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(var(--cyan-rgb), 0.3);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
  .bc-label { font-size: 13px; color: var(--text-sub); font-family: var(--mono); white-space: nowrap; letter-spacing: 0.02em; }
  .bc-label b { color: var(--cyan); font-weight: 700; }
  .bc-range { width: 130px; height: 4px; accent-color: var(--cyan); cursor: pointer; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 11px;
    background: rgba(10, 18, 30, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--chrome); }
  .seg-btn { font: inherit; font-size: 14px; color: var(--text-sub); padding: 9px 18px; border-radius: 7px;
    background: transparent; border: none; cursor: pointer; display: flex; align-items: center; gap: 9px; letter-spacing: 0.02em; transition: 0.15s; white-space: nowrap; }
  .seg-btn:hover { color: var(--text-main); }
  .seg-btn.on { color: #06121f; background: var(--cyan); font-weight: 600; }
  kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: rgba(var(--cyan-rgb), 0.12); color: var(--cyan); border: 1px solid rgba(var(--cyan-rgb), 0.25); }
  .seg-btn.on kbd { background: rgba(0, 0, 0, 0.22); color: #06121f; border-color: rgba(0, 0, 0, 0.15); }

  /* stage */
  .stage-wrap { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; }
  .fade-root { position: relative; }
  .layout-single { position: relative; }
  .layout-dual { position: relative; display: flex; align-items: stretch; }
  .dual-divider { width: 1px; margin: 0 32px; align-self: stretch;
    background: linear-gradient(180deg, transparent, rgba(var(--cyan-rgb), 0.4), transparent); }

  /* merged 창고+가방 — single wide frame */
  .merged { position: relative; padding: 18px 22px; border-radius: 16px;
    border: 1px solid var(--chrome-strong);
    background: linear-gradient(160deg, rgba(16, 30, 50, 0.54), rgba(11, 22, 39, 0.6));
    backdrop-filter: blur(var(--blur)) saturate(1.15); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.15);
    box-shadow: 0 26px 66px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  .merged-head { display: flex; align-items: flex-end; position: relative;
    padding: 13px 18px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(30, 50, 80, 0.5), rgba(21, 39, 65, 0.44));
    backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  .mhcol { flex: 0 0 auto; }
  .mhcol-wh { width: var(--wh-w); }
  .mhcol-bag { width: var(--bag-w); padding-right: 46px; }
  .merged-body { display: flex; margin-top: 14px; }
  .merged-foot { display: flex; align-items: center; margin-top: 14px;
    padding: 13px 18px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(30, 50, 80, 0.5), rgba(21, 39, 65, 0.44));
    backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  .mfcol { display: flex; align-items: center; gap: 8px; }
  .mfcol-wh { width: var(--wh-w); }
  .mfcol-bag { width: var(--bag-w); }
  /* body columns carry distinct tones: 창고 darker, 가방 brighter */
  .mcol { position: relative; }
  .mcol > * { position: relative; z-index: 1; }
  .mcol::before { content: ''; position: absolute; inset: -10px -12px -12px; border-radius: 12px; z-index: 0; }
  .mcol-warehouse::before { background: linear-gradient(160deg, rgba(6, 13, 24, 0.18), rgba(9, 18, 31, 0.1)); }
  .mcol-bag::before { background: linear-gradient(160deg, rgba(28, 48, 74, 0.12), rgba(20, 38, 60, 0.07)); }
  /* one continuous vertical seam through head / body / foot (same x) */
  .vsep { flex: 0 0 1px; width: 1px; margin: 0 27px; align-self: stretch;
    background: linear-gradient(180deg, transparent, rgba(var(--cyan-rgb), 0.42) 18%, rgba(var(--cyan-rgb), 0.42) 82%, transparent); }
  .vsep-head, .vsep-foot { background: rgba(var(--cyan-rgb), 0.16); }
  .close-x2 { position: absolute; top: -4px; right: -6px; width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; background: rgba(10, 18, 30, 0.5); color: var(--text-sub);
    border: 1px solid rgba(var(--cyan-rgb), 0.2); cursor: pointer; transition: 0.14s; z-index: 12; }
  .close-x2:hover { color: var(--cyan); border-color: var(--cyan); }
  .merged .mcol .cat-row { margin-top: 0; }

  .close-x { position: absolute; top: -46px; right: 0; width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; background: rgba(10, 18, 30, 0.6); color: var(--text-sub);
    border: 1px solid rgba(var(--cyan-rgb), 0.2); cursor: pointer; backdrop-filter: blur(6px); transition: 0.14s; z-index: 12; }
  .close-x:hover { color: var(--cyan); border-color: var(--cyan); }

  /* panel frame (frosted, cyan border + corner brackets) */
  .panel { position: relative; padding: 18px 22px; border-radius: 14px;
    border: 1px solid var(--chrome-strong);
    background: linear-gradient(160deg, rgba(16, 30, 50, 0.54), rgba(11, 22, 39, 0.6));
    backdrop-filter: blur(var(--blur)) saturate(1.15); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.15);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  /* layered bars: header / footer are brighter + more opaque than the body */
  .bar { border-radius: 10px;
    background: linear-gradient(160deg, rgba(32, 53, 82, 0.62), rgba(23, 41, 67, 0.56));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07); }
  .br { position: absolute; width: 16px; height: 16px; border: 1.5px solid var(--chrome-strong); pointer-events: none; opacity: 0.9; }
  .br.tl { top: 7px; left: 7px; border-right: none; border-bottom: none; border-radius: 3px 0 0 0; }
  .br.tr { top: 7px; right: 7px; border-left: none; border-bottom: none; border-radius: 0 3px 0 0; }
  .br.bl { bottom: 7px; left: 7px; border-right: none; border-top: none; border-radius: 0 0 0 3px; }
  .br.br2 { bottom: 7px; right: 7px; border-left: none; border-top: none; border-radius: 0 0 3px 0; }

  /* header */
  .p-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    padding: 13px 18px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(30, 50, 80, 0.5), rgba(21, 39, 65, 0.44));
    backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  .merged-head .p-head { padding: 0; background: none; box-shadow: none; border-radius: 0; }
  .p-body { position: relative; margin-top: 14px; }
  .p-body > * { position: relative; z-index: 1; }
  .p-body::before { content: ''; position: absolute; inset: -10px -12px -12px; border-radius: 12px; z-index: 0;
    background: linear-gradient(160deg, rgba(28, 48, 74, 0.12), rgba(20, 38, 60, 0.07)); }
  .p-body .cat-row { margin-top: 0; }
  .p-title { font-size: 27px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-main);
    white-space: nowrap; flex-shrink: 0; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); }
  .cap { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
  .cap-num { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
  .cap-cap { color: var(--text-sub); font-weight: 400; font-size: 15px; }
  .cap-track { width: 162px; height: 6px; border-radius: 3px; background: rgba(22, 38, 60, 0.9);
    overflow: hidden; border: 1px solid rgba(var(--cyan-rgb), 0.12); }
  .cap-fill { height: 100%; border-radius: 3px; transition: width 0.35s ease; }

  /* category row (icon-only) */
  .cat-row { display: flex; gap: 8px; margin-top: 0; }
  .cat-btn { flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 11px 4px; border-radius: 10px; background: rgba(40, 60, 88, 0.32); border: 1px solid var(--chrome);
    color: #c2d4e6; cursor: pointer; font: inherit; transition: 0.14s; }
  .cat-btn:hover { color: var(--cyan-bright); background: rgba(var(--cyan-rgb), 0.1); border-color: rgba(var(--cyan-rgb), 0.34); }
  .cat-btn.on { color: var(--cat-on-fg); background: var(--cat-on-bg); border-color: var(--cat-on-bd);
    box-shadow: inset 0 0 0 1px var(--cat-on-bg); }

  .p-divider { height: 0; margin: 13px 0; background: none; }

  /* grid + slots */
  .grid-scroll { max-height: 500px; overflow-y: auto; overflow-x: hidden; padding: 3px; margin: -3px; }
  .grid-scroll::-webkit-scrollbar { width: 8px; }
  .grid-scroll::-webkit-scrollbar-track { background: rgba(22, 38, 60, 0.4); border-radius: 4px; }
  .grid-scroll::-webkit-scrollbar-thumb { background: rgba(var(--cyan-rgb), 0.4); border-radius: 4px; }
  .grid-scroll::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
  .grid { display: grid; gap: 11px; grid-auto-rows: 90px; }
  .merged .mcol .cat-row, .merged .mcol .p-divider { margin-top: 0; }
  .merged .mcol .cat-row { padding: 0 8px; }

  /* slots are individual frosted-glass TILES: each pane shows the blurred world behind IT */
  .slot { width: 90px; height: 90px; position: relative; border-radius: 10px; border: 1px solid rgba(160, 190, 218, 0.34);
    background: linear-gradient(150deg, rgba(34, 54, 84, 0.14), rgba(24, 42, 66, 0.18));
    backdrop-filter: blur(var(--blur)) saturate(1.22); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.22);
    display: grid; place-items: center; cursor: pointer; color: #cfe2f2;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.13);
    transition: box-shadow 0.13s ease, border-color 0.13s ease, transform 0.13s ease; }
  .slot.empty { border-style: solid; border-color: rgba(150, 178, 206, 0.2); cursor: default;
    background: linear-gradient(150deg, rgba(20, 36, 58, 0.1), rgba(15, 28, 46, 0.12));
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
  .slot-icon { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45)); }
  .slot.sel .slot-icon { filter: drop-shadow(0 0 6px currentColor); }

  .slot:not(.empty):hover { border-color: var(--cyan); transform: translateY(-1px); }
  .slot[data-glow="soft"]:not(.empty):hover { box-shadow: 0 0 calc(16px * var(--glow)) rgba(var(--cyan-rgb), calc(0.5 * var(--glow))); }
  .slot[data-glow="soft"].sel { border-color: var(--cyan-bright); box-shadow: 0 0 calc(26px * var(--glow)) rgba(var(--cyan-rgb), calc(0.8 * var(--glow))); }
  .slot[data-glow="ring"]:not(.empty):hover { box-shadow: inset 0 0 0 1.5px var(--cyan); }
  .slot[data-glow="ring"].sel { border-color: var(--cyan-bright); box-shadow: inset 0 0 0 2px var(--cyan-bright), 0 0 calc(12px * var(--glow)) rgba(var(--cyan-rgb), calc(0.5 * var(--glow))); }
  .slot[data-glow="edge"]:not(.empty):hover { border-color: var(--cyan); box-shadow: inset 0 -3px 0 -1px var(--cyan); }
  .slot[data-glow="edge"].sel { border-color: var(--cyan-bright); box-shadow: inset 0 -3px 0 -1px var(--cyan-bright), 0 0 calc(10px * var(--glow)) rgba(var(--cyan-rgb), calc(0.45 * var(--glow))); }

  .slot-qty { position: absolute; top: 6px; right: 6px; font-family: var(--mono); font-size: 14px; font-weight: 700;
    line-height: 1; color: #ffffff; background: rgba(6, 12, 22, 0.82); padding: 3px 6px; border-radius: 4px; letter-spacing: 0.02em; }
  .new-dot { position: absolute; top: 7px; left: 7px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--cyan-bright); box-shadow: 0 0 8px var(--cyan), 0 0 2px var(--cyan-bright); }

  /* grade bars */
  .gb-underline { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; border-radius: 0 0 9px 9px; }
  .gb-corner { position: absolute; bottom: 3px; width: 10px; height: 10px; border: 1.5px solid; }
  .gb-bl { left: 3px; border-top: none; border-right: none; border-radius: 0 0 0 3px; }
  .gb-br { right: 3px; border-top: none; border-left: none; border-radius: 0 0 3px 0; }
  .gb-full { position: absolute; inset: 0; border-radius: 8px; pointer-events: none; }

  /* tooltip */
  .tooltip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    padding: 10px 14px; border-radius: 9px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
    background: rgba(5, 10, 18, 0.97); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--cyan); border-left: 3px solid var(--cyan);
    white-space: nowrap; z-index: 60; pointer-events: none;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 18px rgba(var(--cyan-rgb), 0.25); }
  .tt-name { font-size: 17px; font-weight: 700; color: #ffffff; letter-spacing: 0.01em; }
  .tt-grade { font-size: 13px; font-weight: 600; font-family: var(--mono); }

  /* bottom bar + controls */
  .bottom-bar { display: flex; align-items: center; gap: 8px; margin-top: 14px;
    padding: 13px 18px; border-radius: 10px;
    background: linear-gradient(160deg, rgba(30, 50, 80, 0.5), rgba(21, 39, 65, 0.44));
    backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  .bb-spacer { flex: 1; }
  .sort-wrap, .sort-btn, .icon-btn, .act-btn { flex-shrink: 0; }
  .act-btn, .sort-btn, .act-label, .sort-item, .cat-label { white-space: nowrap; }
  .sort-wrap { position: relative; display: flex; gap: 6px; }
  .sort-btn { display: flex; align-items: center; gap: 9px; padding: 12px 17px; border-radius: 8px;
    background: rgba(30, 48, 74, 0.5); border: 1px solid var(--chrome); color: var(--text-main);
    cursor: pointer; font: inherit; font-size: 16px; min-width: 128px; justify-content: space-between; transition: 0.13s; }
  .sort-btn:hover { border-color: var(--cyan); }
  .icon-btn { position: relative; width: 48px; height: 48px; border-radius: 8px; background: rgba(30, 48, 74, 0.5);
    border: 1px solid var(--chrome); color: var(--text-sub); cursor: pointer; display: grid; place-items: center; transition: 0.13s; }
  .icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }
  .dir-mark { position: absolute; bottom: 2px; right: 5px; font-size: 9px; font-family: var(--mono); color: var(--cyan); }
  .sort-scrim { position: fixed; inset: 0; z-index: 40; }
  .sort-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 41; padding: 5px; min-width: 124px;
    background: rgba(12, 22, 36, 0.97); backdrop-filter: blur(8px); border: 1px solid rgba(var(--cyan-rgb), 0.22);
    border-radius: 8px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5); }
  .sort-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 5px;
    background: transparent; border: none; color: var(--text-sub); cursor: pointer; font: inherit; font-size: 13px; }
  .sort-item:hover { background: rgba(var(--cyan-rgb), 0.12); color: var(--text-main); }
  .sort-item.on { color: var(--cyan); }

  .act-btn { display: flex; align-items: center; gap: 9px; padding: 12px 19px; border-radius: 8px;
    background: rgba(30, 48, 74, 0.42); border: 1px solid var(--chrome); color: var(--text-sub);
    cursor: pointer; font: inherit; font-size: 16px; transition: 0.13s; }
