<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인벤토리 / 창고 UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --slot: #16263c;
    --slot-border: #34516f;
    --text-main: #eaf3fb;
    --text-sub: #aebfd0;
    --cyan: #5fc4ff;
    --cyan-bright: #aee3ff;
    --cyan-rgb: 95, 196, 255;
    --glow: 0.72;
    --blur: 6px;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #060c14; overflow: hidden; }
  body { font-family: 'IBM Plex Sans KR', sans-serif; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #060c14; }
  #canvas { width: 1920px; height: 1080px; transform-origin: center center; }
  #root { width: 100%; height: 100%; }

  .app-root {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    color: var(--text-main);
    background: radial-gradient(1200px 820px at 50% 28%, #12233a 0%, #0b1422 68%, #081019 100%);
  }

  /* ambient game-screen backdrop */
  .ambiance { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(var(--cyan-rgb), 0.10), transparent 60%),
      radial-gradient(760px 620px at 10% 112%, rgba(70, 130, 210, 0.10), transparent 60%),
      radial-gradient(720px 600px at 92% 102%, rgba(var(--cyan-rgb), 0.06), transparent 60%);
  }
  .ambiance::after { content: ''; position: absolute; inset: 0; opacity: 0.5;
    background-image:
      linear-gradient(rgba(var(--cyan-rgb), 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--cyan-rgb), 0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
  }

  /* top segmented switcher */
  .topbar { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); z-index: 20; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 11px;
    background: rgba(10, 18, 30, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(var(--cyan-rgb), 0.18); }
  .seg-btn { font: inherit; font-size: 14px; color: var(--text-sub); padding: 9px 18px; border-radius: 7px;
    background: transparent; border: none; cursor: pointer; display: flex; align-items: center; gap: 9px; letter-spacing: 0.02em; transition: 0.15s; white-space: nowrap; }
  .seg-btn:hover { color: var(--text-main); }
  .seg-btn.on { color: #06121f; background: var(--cyan); font-weight: 600; }
  kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: rgba(var(--cyan-rgb), 0.12); color: var(--cyan); border: 1px solid rgba(var(--cyan-rgb), 0.25); }
  .seg-btn.on kbd { background: rgba(0, 0, 0, 0.22); color: #06121f; border-color: rgba(0, 0, 0, 0.15); }

  /* stage */
  .stage-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .fade-root { position: relative; }
  .layout-single { position: relative; }
  .layout-dual { position: relative; display: flex; align-items: stretch; }
  .dual-divider { width: 1px; margin: 0 32px; align-self: stretch;
    background: linear-gradient(180deg, transparent, rgba(var(--cyan-rgb), 0.4), transparent); }

  .close-x { position: absolute; top: -46px; right: 0; width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; background: rgba(10, 18, 30, 0.6); color: var(--text-sub);
    border: 1px solid rgba(var(--cyan-rgb), 0.2); cursor: pointer; backdrop-filter: blur(6px); transition: 0.14s; z-index: 12; }
  .close-x:hover { color: var(--cyan); border-color: var(--cyan); }

  /* panel frame (frosted, cyan border + corner brackets) */
  .panel { position: relative; padding: 24px 26px 22px; border-radius: 11px;
    border: 1px solid rgba(var(--cyan-rgb), 0.22);
    background: linear-gradient(160deg, rgba(16, 28, 46, 0.72), rgba(11, 20, 34, 0.74));
    backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04); }
  .br { position: absolute; width: 16px; height: 16px; border: 1.5px solid var(--cyan); pointer-events: none; opacity: 0.85; }
  .br.tl { top: 7px; left: 7px; border-right: none; border-bottom: none; border-radius: 3px 0 0 0; }
  .br.tr { top: 7px; right: 7px; border-left: none; border-bottom: none; border-radius: 0 3px 0 0; }
  .br.bl { bottom: 7px; left: 7px; border-right: none; border-top: none; border-radius: 0 0 0 3px; }
  .br.br2 { bottom: 7px; right: 7px; border-left: none; border-top: none; border-radius: 0 0 3px 0; }

  /* header */
  .p-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .p-head-l { display: flex; flex-direction: column; gap: 8px; }
  .p-title { font-size: 21px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-main); }
  .barcode { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .barcode span { display: block; height: 100%; border-radius: 1px; }
  .cap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cap-num { font-family: var(--mono); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  .cap-cap { color: var(--text-sub); font-weight: 400; font-size: 13px; }
  .cap-track { width: 128px; height: 5px; border-radius: 3px; background: rgba(22, 38, 60, 0.9);
    overflow: hidden; border: 1px solid rgba(var(--cyan-rgb), 0.12); }
  .cap-fill { height: 100%; border-radius: 3px; transition: width 0.35s ease; }

  /* category row */
  .cat-row { display: flex; gap: 6px; margin-top: 16px; }
  .cat-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 4px 7px; border-radius: 8px; background: transparent; border: 1px solid transparent;
    color: var(--text-sub); cursor: pointer; font: inherit; transition: 0.14s; }
  .cat-btn:hover { color: var(--text-main); background: rgba(var(--cyan-rgb), 0.06); }
  .cat-btn.on { color: var(--cyan); background: rgba(var(--cyan-rgb), 0.1); border-color: rgba(var(--cyan-rgb), 0.32);
    box-shadow: inset 0 -2px 0 rgba(var(--cyan-rgb), 0.55); }
  .cat-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.01em; white-space: nowrap; }

  .p-divider { height: 1px; margin: 14px 0; background: linear-gradient(90deg, transparent, rgba(var(--cyan-rgb), 0.28), transparent); }

  /* grid + slots */
  .grid-scroll { padding: 3px; margin: -3px; }
  .grid-scroll::-webkit-scrollbar { width: 8px; }
  .grid-scroll::-webkit-scrollbar-track { background: rgba(22, 38, 60, 0.4); border-radius: 4px; }
  .grid-scroll::-webkit-scrollbar-thumb { background: rgba(var(--cyan-rgb), 0.4); border-radius: 4px; }
  .grid-scroll::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
  .grid { display: grid; gap: 9px; grid-auto-rows: 64px; }

  .slot { width: 64px; height: 64px; position: relative; border-radius: 8px; border: 1px solid var(--slot-border);
    background: linear-gradient(150deg, rgba(28, 46, 72, 0.9), rgba(18, 30, 48, 0.9));
    display: grid; place-items: center; cursor: pointer; color: #cfe2f2;
    transition: box-shadow 0.13s ease, border-color 0.13s ease, transform 0.13s ease; }
  .slot.empty { background: rgba(14, 24, 40, 0.45); border-style: dashed; border-color: rgba(52, 81, 111, 0.45);
    cursor: default; box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.25); }
  .slot-icon { color: #cfe2f2; }
  .slot.sel .slot-icon { color: var(--cyan-bright); }
  .slot.is-legend .slot-icon { color: #ffe2ad; }

  .slot:not(.empty):hover { border-color: var(--cyan); transform: translateY(-1px); }
  .slot[data-glow="soft"]:not(.empty):hover { box-shadow: 0 0 calc(16px * var(--glow)) rgba(var(--cyan-rgb), calc(0.5 * var(--glow))); }
  .slot[data-glow="soft"].sel { border-color: var(--cyan-bright); box-shadow: 0 0 calc(26px * var(--glow)) rgba(var(--cyan-rgb), calc(0.8 * var(--glow))); }
  .slot[data-glow="ring"]:not(.empty):hover { box-shadow: inset 0 0 0 1.5px var(--cyan); }
  .slot[data-glow="ring"].sel { border-color: var(--cyan-bright); box-shadow: inset 0 0 0 2px var(--cyan-bright), 0 0 calc(12px * var(--glow)) rgba(var(--cyan-rgb), calc(0.5 * var(--glow))); }
  .slot[data-glow="edge"]:not(.empty):hover { border-color: var(--cyan); box-shadow: inset 0 -3px 0 -1px var(--cyan); }
  .slot[data-glow="edge"].sel { border-color: var(--cyan-bright); box-shadow: inset 0 -3px 0 -1px var(--cyan-bright), 0 0 calc(10px * var(--glow)) rgba(var(--cyan-rgb), calc(0.45 * var(--glow))); }

  .slot-qty { position: absolute; top: 4px; right: 4px; font-family: var(--mono); font-size: 11px; font-weight: 600;
    line-height: 1; color: var(--text-main); background: rgba(8, 15, 26, 0.72); padding: 2px 4px; border-radius: 4px; letter-spacing: 0.02em; }
  .new-dot { position: absolute; top: 5px; left: 5px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan-bright); box-shadow: 0 0 7px var(--cyan), 0 0 2px var(--cyan-bright); }

  /* grade bars */
  .gb-underline { position: absolute; left: 9px; right: 9px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; }
  .gb-corner { position: absolute; bottom: 3px; width: 10px; height: 10px; border: 1.5px solid; }
  .gb-bl { left: 3px; border-top: none; border-right: none; border-radius: 0 0 0 3px; }
  .gb-br { right: 3px; border-top: none; border-left: none; border-radius: 0 0 3px 0; }
  .gb-full { position: absolute; inset: 0; border-radius: 8px; pointer-events: none; }

  /* tooltip */
  .tooltip { position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%);
    padding: 8px 11px 8px 13px; min-width: 132px; border-radius: 7px;
    background: rgba(10, 18, 30, 0.94); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    border: 1px solid rgba(var(--cyan-rgb), 0.22); border-left: 2px solid var(--cyan);
    white-space: nowrap; z-index: 30; pointer-events: none; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55); }
  .tt-name { font-size: 13px; font-weight: 600; }
  .tt-sub { font-size: 11px; color: var(--text-sub); margin-top: 3px; font-family: var(--mono); }

  /* bottom bar + controls */
  .bottom-bar { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(var(--cyan-rgb), 0.1); }
  .bb-spacer { flex: 1; }
  .sort-wrap, .sort-btn, .icon-btn, .act-btn { flex-shrink: 0; }
  .act-btn, .sort-btn, .act-label, .sort-item, .cat-label { white-space: nowrap; }
  .sort-wrap { position: relative; display: flex; gap: 6px; }
  .sort-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 7px;
    background: rgba(22, 38, 60, 0.7); border: 1px solid var(--slot-border); color: var(--text-main);
    cursor: pointer; font: inherit; font-size: 13px; min-width: 100px; justify-content: space-between; transition: 0.13s; }
  .sort-btn:hover { border-color: var(--cyan); }
  .icon-btn { position: relative; width: 38px; height: 38px; border-radius: 7px; background: rgba(22, 38, 60, 0.7);
    border: 1px solid var(--slot-border); color: var(--text-sub); cursor: pointer; display: grid; place-items: center; transition: 0.13s; }
  .icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }
  .dir-mark { position: absolute; bottom: 2px; right: 5px; font-size: 9px; font-family: var(--mono); color: var(--cyan); }
  .sort-scrim { position: fixed; inset: 0; z-index: 40; }
  .sort-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 41; padding: 5px; min-width: 124px;
    background: rgba(12, 22, 36, 0.97); backdrop-filter: blur(8px); border: 1px solid rgba(var(--cyan-rgb), 0.22);
    border-radius: 8px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5); }
  .sort-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 5px;
    background: transparent; border: none; color: var(--text-sub); cursor: pointer; font: inherit; font-size: 13px; }
  .sort-item:hover { background: rgba(var(--cyan-rgb), 0.12); color: var(--text-main); }
  .sort-item.on { color: var(--cyan); }

  .act-btn { display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 7px;
    background: rgba(22, 38, 60, 0.55); border: 1px solid var(--slot-border); color: var(--text-sub);
    cursor: pointer; font: inherit; font-size: 13px; transition: 0.13s; }
  .act-btn:hover { color: var(--text-main); border-color: var(--cyan); background: rgba(var(--cyan-rgb), 0.08); }
  .act-btn.danger:hover { color: #ff9a9a; border-color: #ff6a6a; background: rgba(255, 90, 90, 0.08); }
  .act-btn.primary { color: #06121f; background: var(--cyan); border-color: var(--cyan); font-weight: 600; }
  .act-btn.primary:hover { background: var(--cyan-bright); border-color: var(--cyan-bright); color: #06121f; }

  /* toast */
  .toast { position: absolute; bottom: 40px; left: 50%; transform: translate(-50%, 12px); z-index: 50;
    padding: 11px 20px; border-radius: 9px; background: rgba(12, 22, 36, 0.92); backdrop-filter: blur(8px);
    border: 1px solid rgba(var(--cyan-rgb), 0.3); border-left: 3px solid var(--cyan); color: var(--text-main);
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* opening fade-in */
  @keyframes panelIn { from { opacity: 0; transform: scale(0.984) translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes contentIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: no-preference) {
    .fade-root.intro .panel { animation: panelIn 0.34s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade-root.intro .p-head, .fade-root.intro .cat-row, .fade-root.intro .grid, .fade-root.intro .bottom-bar { animation: contentIn 0.55s ease both; animation-delay: 0.16s; }
    .fade-root.intro .close-x { animation: contentIn 0.5s ease both; animation-delay: 0.22s; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="canvas">
      <div id="root"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    (function () {
      var canvas = document.getElementById('canvas');
      function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        canvas.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
